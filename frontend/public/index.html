<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="OnMarket - Your premier e-commerce destination for quality products" />
    
    <!-- Performance optimizations -->
    <meta name="referrer" content="same-origin" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <!-- PWA manifest and icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Critical CSS - Bootstrap (only essential components) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
      media="all"
    />
    
    <!-- Bootstrap Icons - Load asynchronously -->
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      />
    </noscript>
    
    <!-- Resource hints for faster navigation -->
    <link rel="prefetch" href="/static/js/main.js" />
    <link rel="prefetch" href="/static/css/main.css" />
    
    <title>OnMarket - Premium E-commerce Experience</title>
    
    <!-- Structured data for better SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OnMarket",
      "description": "Premium e-commerce platform",
      "url": "https://rahulsrivastava0124.github.io/"
    }
    </script>
  </head>

  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #f8f9fa;">
        <h2>JavaScript Required</h2>
        <p>You need to enable JavaScript to run this application.</p>
      </div>
    </noscript>
    
    <!-- App container with loading fallback -->
    <div id="root">
      <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
          <p style="color: #666; margin: 0;">Loading OnMarket...</p>
        </div>
      </div>
    </div>
    
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #initial-loader {
        transition: opacity 0.3s ease-out;
      }
    </style>
    
    <script>
      // Remove initial loader when React app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 300);
          }
        }, 500);
      });
      
      // Performance monitoring
      if ('performance' in window) {
        window.addEventListener('load', function() {
          setTimeout(function() {
            const perfData = window.performance.timing;
            const loadTime = perfData.loadEventEnd - perfData.navigationStart;
            console.log('Page load time:', loadTime + 'ms');
          }, 0);
        });
      }
    </script>

    <!-- Bootstrap JavaScript - Load asynchronously and only when needed -->
    <script>
      // Lazy load Bootstrap JS only when interactive elements are present
      function loadBootstrapJS() {
        if (document.querySelector('[data-bs-toggle]')) {
          const script1 = document.createElement('script');
          script1.src = 'https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js';
          script1.integrity = 'sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r';
          script1.crossOrigin = 'anonymous';
          
          const script2 = document.createElement('script');
          script2.src = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js';
          script2.integrity = 'sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS';
          script2.crossOrigin = 'anonymous';
          
          document.head.appendChild(script1);
          script1.onload = () => document.head.appendChild(script2);
        }
      }
      
      // Load Bootstrap JS when DOM is ready or on first interaction
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadBootstrapJS);
      } else {
        loadBootstrapJS();
      }
      
      // Also load on first user interaction
      ['click', 'touchstart', 'scroll'].forEach(event => {
        document.addEventListener(event, loadBootstrapJS, { once: true, passive: true });
      });
    </script>
  </body>
</html>
